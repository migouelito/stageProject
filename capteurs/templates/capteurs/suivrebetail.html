{% extends 'base/base.html' %}

{% block content %}
{% load static %}

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #008000 0%, #008000 100%);
        min-height: 100vh;
        overflow-x: hidden;
    }

    .main-container {
        position: relative;
        min-height: 100vh;
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.02);
    }

    .container-header {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.1) 100%);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 20px;
        padding: 25px 30px;
        margin: 20px;
        margin-bottom: 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 
            0 8px 32px rgba(0, 0, 0, 0.1),
            0 2px 16px rgba(0, 0, 0, 0.05),
            inset 0 1px 0 rgba(255, 255, 255, 0.3);
        position: relative;
        overflow: hidden;
        flex-wrap: wrap;
        gap: 15px;
    }

    .container-header::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, #008000, #008000, #008000);
        animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }

    .container-header h1 {
    color: #ffffff; /* Blanc pur */
    font-size: 2rem;
    font-weight: 1000;
    text-shadow: 
        0 4px 8px rgba(0, 0, 0, 0.3),
        0 2px 4px rgba(0, 0, 0, 0.2);
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
}


    .container-header h1::before {
        content: '🐄';
        font-size: 1.8rem;
        -webkit-text-fill-color: initial;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
    }

    .btn-retour {
        background: linear-gradient(135deg, #ffffff 0%, #ffffff 100%);
        color: #333;
        padding: 12px 24px;
        border: none;
        border-radius: 50px;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 
            0 6px 20px rgba(0, 128, 0, 0.4),
            0 2px 8px rgba(0, 0, 0, 0.1);
        display: flex;
        align-items: center;
        gap: 8px;
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-retour::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(0, 128, 0, 0.2), transparent);
        transition: left 0.6s;
    }

    .btn-retour:hover::before {
        left: 100%;
    }

    .btn-retour:hover {
        transform: translateY(-2px) scale(1.05);
        box-shadow: 
            0 10px 30px rgba(0, 128, 0, 0.5),
            0 4px 16px rgba(0, 0, 0, 0.2);
        background: linear-gradient(135deg, #f0f0f0 0%, #ffffff 100%);
    }

    .btn-retour:active {
        transform: translateY(-1px) scale(1.02);
    }

    .btn-retour .icon {
        font-size: 16px;
        transition: transform 0.3s ease;
    }

    .btn-retour:hover .icon {
        transform: translateX(-2px);
    }

    .map-container {
        margin: 0 20px 20px 20px;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 
            0 20px 60px rgba(0, 0, 0, 0.3),
            0 8px 25px rgba(0, 0, 0, 0.2),
            inset 0 1px 0 rgba(255, 255, 255, 0.1);
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        position: relative;
    }

    .map-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(45deg, rgba(0, 128, 0, 0.1), rgba(0, 128, 0, 0.1));
        pointer-events: none;
        z-index: 1;
    }

    #map {
        height: calc(100vh - 200px);
        width: 100%;
        border: none;
        position: relative;
        z-index: 2;
    }

    .leaflet-control-zoom {
        border: none !important;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2) !important;
        border-radius: 15px !important;
        overflow: hidden;
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.9) !important;
    }

    .leaflet-control-zoom a {
        background: rgba(255, 255, 255, 0.9) !important;
        color: #333 !important;
        border: none !important;
        transition: all 0.3s ease !important;
        font-weight: 600 !important;
        backdrop-filter: blur(10px);
    }

    .leaflet-control-zoom a:hover {
        background: linear-gradient(135deg, #008000, #008000) !important;
        color: white !important;
        transform: scale(1.05);
    }

    .leaflet-popup-content-wrapper {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.9) 100%) !important;
        backdrop-filter: blur(20px);
        border-radius: 15px !important;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2) !important;
        border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .leaflet-popup-content {
        margin: 15px !important;
        color: #333 !important;
        font-weight: 600 !important;
        font-size: 14px !important;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    .leaflet-popup-tip {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.9) 100%) !important;
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .status-indicator {
        position: absolute;
        top: 20px;
        right: 30px;
        background: linear-gradient(135deg, rgba(0, 128, 0, 0.9) 0%, rgba(0, 128, 0, 0.9) 100%);
        color: white;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        box-shadow: 0 4px 15px rgba(0, 128, 0, 0.3);
        display: flex;
        align-items: center;
        gap: 6px;
        z-index: 1000;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .status-indicator::before {
        content: '●';
        color: #008000;
        animation: blink 1.5s infinite;
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
    }

    .loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, rgba(0, 128, 0, 0.9) 0%, rgba(0, 128, 0, 0.9) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        transition: opacity 0.5s ease;
    }

    .loading-spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .animal-counter {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.85) 100%);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 15px;
        padding: 15px 20px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        z-index: 1000;
        color: #333;
        font-weight: 600;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .animal-counter::before {
        content: '🐄';
        font-size: 16px;
    }

    @media (max-width: 768px) {
        .container-header {
            margin: 10px;
            padding: 20px;
            flex-direction: column;
            text-align: center;
        }

        .container-header h1 {
            font-size: 1.6rem;
            margin-bottom: 10px;
        }

        .map-container {
            margin: 0 10px 10px 10px;
        }

        #map {
            height: calc(100vh - 180px);
        }

        .status-indicator {
            top: 10px;
            right: 20px;
        }
    }

    .floating-controls {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .control-btn {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.85) 100%);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 12px;
        padding: 12px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        cursor: pointer;
        transition: all 0.3s ease;
        color: #333;
        font-size: 16px;
        width: 45px;
        height: 45px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .control-btn:hover {
        transform: translateY(-2px) scale(1.05);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        background: linear-gradient(135deg, #008000, #008000);
        color: white;
    }
</style>

<div class="main-container">
    <div class="container-header">
        <h1>Suivez en temps réel le mouvement de votre bétail</h1>
        <a href="{% url 'liste_des_zones' %}" class="btn-retour">
            <span class="icon">←</span>
            Retour à la liste des zones
        </a>
    </div>

    <div class="map-container">
        <div class="status-indicator">
            Connexion active
        </div>
        
        <div class="floating-controls">
            <div class="control-btn" title="Centrer la carte" onclick="centerMap()">🎯</div>
            <div class="control-btn" title="Mode plein écran" onclick="toggleFullscreen()">⛶</div>
            <div class="control-btn" title="Actualiser" onclick="refreshData()">↻</div>
        </div>
        
        <div class="animal-counter" id="animalCounter">
            0 animaux détectés
        </div>
        
        <div id="map"></div>
        
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

<script>
const userId = "{{ user_id | escapejs }}"; // Ajout de escapejs pour sécuriser
console.log('user_id récupéré:', userId);

// Validation de MY_GLOBAL_VARIABLE
const wsHost = "{{ MY_GLOBAL_VARIABLE | escapejs }}";
if (!wsHost || typeof wsHost !== 'string' || wsHost.trim() === '') {
    console.error('Erreur: MY_GLOBAL_VARIABLE n\'est pas défini ou invalide');
    document.querySelector('.status-indicator').style.background = 'linear-gradient(135deg, rgba(255, 69, 58, 0.9) 0%, rgba(255, 45, 85, 0.9) 100%)';
    document.querySelector('.status-indicator').textContent = 'Erreur de configuration';
    throw new Error('MY_GLOBAL_VARIABLE non défini');
}

const trackerMarkers = {};
const map = L.map('map').setView([0, 0], 2);
let animalCount = 0;

// Masquer le loader après initialisation
setTimeout(() => {
    document.getElementById('loadingOverlay').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('loadingOverlay').style.display = 'none';
    }, 500);
}, 1500);

// Tile layer avec style sombre
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19
}).addTo(map);

function updateAnimalCounter() {
    const counter = document.getElementById('animalCounter');
    counter.textContent = `${animalCount} animaux détectés`;
}

function getAnimalIcon(type_animal) {
    let iconUrl = '';
    switch(type_animal) {
        case 'boeuf':
            iconUrl = '{% static "utilisateurs/images/boeufl.png" %}';
            break;
        case 'ane':
        case 'mouton':
            iconUrl = '{% static "utilisateurs/images/iconsinfo.png" %}';
            break;
        default:
            iconUrl = '{% static "utilisateurs/images/iconsinfo.png" %}';
    }
    return new L.Icon({
        iconUrl: iconUrl,
        shadowUrl: 'https://unpkg.com/leaflet@1.7.1/dist/images/marker-shadow.png',
        iconSize: [50, 50],
        iconAnchor: [25, 50],
        popupAnchor: [0, -50],
        shadowSize: [50, 50],
        className: 'animal-marker'
    });
}

function centerMap() {
    if (Object.keys(trackerMarkers).length > 0) {
        const group = new L.featureGroup(Object.values(trackerMarkers));
        map.fitBounds(group.getBounds(), { padding: [20, 20] });
    }
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}

function refreshData() {
    // Animation de refresh
    const refreshBtn = document.querySelector('.control-btn:last-child');
    refreshBtn.style.transform = 'rotate(360deg)';
    setTimeout(() => {
        refreshBtn.style.transform = '';
    }, 500);
    
    // Ici vous pouvez ajouter la logique de refresh
    console.log('Actualisation des données...');
}

// Création du WebSocket avec encodage de userId
const socket = new WebSocket(`wss://${wsHost}/ws/positions/?user_id=${encodeURIComponent(userId)}`);

socket.onopen = () => {
    console.log('WebSocket connecté !');
    document.querySelector('.status-indicator').style.background = 'linear-gradient(135deg, rgba(0, 128, 0, 0.9) 0%, rgba(0, 128, 0, 0.9) 100%)';
};

socket.onerror = (error) => {
    console.error('WebSocket Error:', error);
    document.querySelector('.status-indicator').style.background = 'linear-gradient(135deg, rgba(255, 69, 58, 0.9) 0%, rgba(255, 45, 85, 0.9) 100%)';
    document.querySelector('.status-indicator').textContent = 'Connexion échouée';
};

socket.onclose = (event) => {
    console.warn('WebSocket fermé:', event.code);
    document.querySelector('.status-indicator').style.background = 'linear-gradient(135deg, rgba(255, 193, 7, 0.9) 0%, rgba(255, 152, 0, 0.9) 100%)';
    document.querySelector('.status-indicator').textContent = 'Connexion fermée';
};

const zoneLayers = {};
let zonesData;
try {
    zonesData = JSON.parse('{{ zones_data_json | escapejs }}');
} catch (e) {
    console.error('Erreur lors du parsing de zones_data_json:', e);
    document.querySelector('.status-indicator').style.background = 'linear-gradient(135deg, rgba(255, 69, 58, 0.9) 0%, rgba(255, 45, 85, 0.9) 100%)';
    document.querySelector('.status-indicator').textContent = 'Erreur de données JSON';
    zonesData = []; // Valeur par défaut pour éviter l'arrêt
}

const allBounds = [];

zonesData.forEach(zone => {
    const forme = zone.forme;
    try {
        let latLngs;

        if (forme === 'polygon' && zone.coins && zone.coins.length > 2) {
            latLngs = zone.coins.map(pt => [pt[0], pt[1]]);
            const layer = L.polygon(latLngs, {
                color: '#008000',
                weight: 3,
                fillOpacity: 0.2,
                fillColor: '#008000'
            }).addTo(map).bindPopup(`
                <div style="text-align: center; font-weight: bold;">
                    🏞️ Zone #${zone.id}
                    <br><span style="color: #666; font-size: 12px;">Polygone</span>
                </div>
            `);
            zoneLayers[zone.id] = { type: 'polygon', coords: latLngs, layer: layer };
            allBounds.push(...latLngs);
        } else if (forme === 'cercle' && zone.latitude && zone.longitude && zone.rayon) {
            const center = [zone.latitude, zone.longitude];
            const layer = L.circle(center, {
                radius: zone.rayon,
                color: '#008000',
                weight: 3,
                fillColor: '#008000',
                fillOpacity: 0.2
            }).addTo(map).bindPopup(`
                <div style="text-align: center; font-weight: bold;">
                    🎯 Zone #${zone.id}
                    <br><span style="color: #666; font-size: 12px;">Cercle - Rayon: ${zone.rayon}m</span>
                </div>
            `);
            zoneLayers[zone.id] = { type: 'circle', coords: center, radius: zone.rayon, layer: layer };
            const circleBounds = layer.getBounds();
            allBounds.push(circleBounds.getSouthWest(), circleBounds.getNorthEast());
        } else if (forme === 'rectangle' && zone.coin1_lat) {
            latLngs = [
                [zone.coin1_lat, zone.coin1_lon],
                [zone.coin2_lat, zone.coin2_lon],
                [zone.coin3_lat, zone.coin3_lon],
                [zone.coin4_lat, zone.coin4_lon],
                [zone.coin1_lat, zone.coin1_lon]
            ];
            const layer = L.polygon(latLngs, {
                color: '#008000',
                weight: 3,
                fillOpacity: 0.2,
                fillColor: '#008000'
            }).addTo(map).bindPopup(`
                <div style="text-align: center; font-weight: bold;">
                    📐 Zone #${zone.id}
                    <br><span style="color: #666; font-size: 12px;">Rectangle</span>
                </div>
            `);
            zoneLayers[zone.id] = { type: 'polygon', coords: latLngs, layer: layer };
            allBounds.push(...latLngs);
        } else {
            console.warn(`Zone #${zone.id} forme inconnue: ${forme}`);
        }
    } catch (e) {
        console.error(`Erreur zone #${zone.id}:`, e);
    }
});

if (allBounds.length > 0) {
    map.fitBounds(allBounds, { padding: [20, 20] });
}

socket.onmessage = function (e) {
    let data;
    try {
        data = JSON.parse(e.data);
    } catch (err) {
        console.error('Erreur lors du parsing des données WebSocket:', err);
        return; // Arrêter le traitement si les données sont invalides
    }

    const trackerId = data.tracker_id || 'default';
    const type_animal = data.type_animal || 'unknown';
    const icon = getAnimalIcon(type_animal);
    const currentLatLng = [data.latitude, data.longitude];

    if (trackerMarkers[trackerId]) {
        trackerMarkers[trackerId].setLatLng(currentLatLng);
        trackerMarkers[trackerId]._popup.setContent(`
            <div style="text-align: center; font-weight: bold; color: #333;">
                🐄 ${type_animal}
                <br><span style="color: #666; font-size: 12px;">ID: ${trackerId}</span>
                <br><span style="color: #999; font-size: 11px;">Lat: ${data.latitude.toFixed(6)}</span>
                <br><span style="color: #999; font-size: 11px;">Lng: ${data.longitude.toFixed(6)}</span>
            </div>
        `);
    } else {
        const marker = L.marker(currentLatLng, {
            icon: icon,
            riseOnHover: true
        }).addTo(map);
        
        marker.bindPopup(`
            <div style="text-align: center; font-weight: bold; color: #333;">
                🐄 ${type_animal}
                <br><span style="color: #666; font-size: 12px;">ID: ${trackerId}</span>
                <br><span style="color: #999; font-size: 11px;">Lat: ${data.latitude.toFixed(6)}</span>
                <br><span style="color: #999; font-size: 11px;">Lng: ${data.longitude.toFixed(6)}</span>
            </div>
        `, { autoPan: false });
        
        trackerMarkers[trackerId] = marker;
        animalCount++;
        updateAnimalCounter();
    }

    // Vérification des zones avec animations
    Object.values(zoneLayers).forEach(zone => {
        let inside = false;
        if (zone.type === 'polygon') {
            inside = L.polygon(zone.coords).getBounds().contains(currentLatLng);
        } else if (zone.type === 'circle') {
            const dist = map.distance(currentLatLng, zone.coords);
            inside = dist <= zone.radius;
        }

        const newColor = inside ? '#008000' : '#ff4757';
        const newFillColor = inside ? '#008000' : '#ff4757';
        
        zone.layer.setStyle({
            color: newColor,
            fillColor: newFillColor,
            weight: inside ? 4 : 3,
            fillOpacity: inside ? 0.3 : 0.2
        });
    });
};

// Styles CSS pour les marqueurs animés
const style = document.createElement('style');
style.textContent = `
    .animal-marker {
        transition: all 0.3s ease;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
    }
    
    .animal-marker:hover {
        transform: scale(1.1);
        filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.4));
    }
    
    .leaflet-marker-icon {
        transition: all 0.3s ease;
    }
`;
document.head.appendChild(style);
</script>

{% endblock %}
